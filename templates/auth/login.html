{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4">
            <h4 class="fw-bold text-center text-primary mb-3">Portal Login</h4>
            <form action="{{ url_for('main.login')}}" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Username or Email</label>
                    <input type="text" class="form-control" name="login_id" placeholder="e.g. Admin or Student1" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="........" required>
                </div>
                <button class="btn btn-primary mt-2 w-100" type="submit">Login</button>
            </form>
            <div class="text-center mt-3 pt-3 border-top">
                <span class="small text-muted">Need an account? </span>
                <a href="{{ url_for('main.register') }}" class="small fw-semibold text-decoration-none">Register</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
