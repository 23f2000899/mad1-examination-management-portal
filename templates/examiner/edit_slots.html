{% extends 'base.html' %}

{% block title %}Edit Slot &middot; Examiner{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="fw-bold mb-3 text-primary">Edit Slot #{{ slot.id }}</h4>
            <div class="small text-muted mb-3">{{ slot.examination.course.code }} &middot; {{ slot.examination.name }}</div>
            <form action="{{ url_for('main.examiner_edit_slot', slot_id=slot.id) }}" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Slot Date</label>
                    <input type="date" class="form-control" name="date" value="{{ slot.date }}" required>
                </div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Start Time</label>
                        <input type="time" class="form-control" name="start_time" value="{{ slot.start_time.strftime('%H:%M') }}" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold">End Time</label>
                        <input type="time" class="form-control" name="end_time" value="{{ slot.end_time.strftime('%H:%M') }}" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Capacity</label>
                    <input type="number" class="form-control" name="max_capacity" value="{{ slot.max_capacity }}" min="1" required>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('main.examiner_slots') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update Slot</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
